    { id:'llo', label:'Local Laws Observatory', name:'Local Laws Observatory', lat:-38, lon:-36, color:0xc9b8ff,
      entries:[

          body:'I contribute to LOCUS, a machine-readable corpus of US municipal and county ordinance codes across 9,239 cities and counties. I write Python for document ingestion, OCR, metadata extraction, deduplication, and data-quality checks over scanned legal documents. I build evaluation datasets and validate LLM outputs against the source ordinances. I run error analysis on retrieval and extraction failures.',

      entries:[

        { title:'Murica', meta:'Godot · GDScript · solo',

          tags:['Godot','GDScript'], links:[{ href:'https://github.com/liangzachary/Murica', text:'GitHub' }] },

  const SITE_BY_ID = Object.fromEntries(SITES.map(s => [s.id, s]));

  // ---------------- scene ----------------
  const canvas = document.getElementById('scene');
  const PIXEL = 3; // screen pixels per rendered pixel: the 8-bit knob
  const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:true });
  renderer.setPixelRatio(1);
  canvas.addEventListener('webglcontextlost', () => { document.getElementById('fallback').style.display = 'grid'; canvas.style.display = 'none'; });
  const scene = new THREE.Scene(); // transparent: the CSS sky gradient shows through
  const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 100);
  const camDirTour = new THREE.Vector3(0, 0.45, 0.89).normalize(); // bird's eye for the idle tour
  const camDirSel  = new THREE.Vector3(0, 0.07, 1).normalize();    // front facing when a site is selected
  let camDist = 7.6, baseDist = 7.6, camDir = camDirTour.clone();
  const X_AXIS = new THREE.Vector3(1, 0, 0);
  const CAM = {
    fitRadius: 3.6,     // world radius that must fit the short side at the start: bigger = starts farther out
    selTiltDesk: 0.35,  // a selected place sits a little below center so its buildings are seen at an angle
    selTiltPhone: 0.3,
    selZoomDesk: 1,     // no zoom on desktop when a place is picked
    selZoomPhone: 0.8,  // phones start far out, so pull in a bit to show the buildings above the sheet
    panelGap: 170,      // px kept between a selected place and the panel's left edge on desktop
    tourTilt: 0.3,      // the walk looks at the trail a little from the side, not straight down

  const isPhone = () => innerWidth <= 640;
  const selTilt = () => isPhone() ? CAM.selTiltPhone : CAM.selTiltDesk;
  const selZoom = () => isPhone() ? CAM.selZoomPhone : CAM.selZoomDesk;
  const tourAim = () => camDirTour.clone().applyAxisAngle(X_AXIS, CAM.tourTilt);
  let aimDir = tourAim(); // where the focused spot on the surface should end up
  camera.position.copy(camDir.clone().multiplyScalar(camDist));
  camera.lookAt(0, 0, 0);
  // zoom bounds adapt to the viewport: phones need to start farther out to fit the whole planet
  let MIN_D = 4.8, MAX_D = 12, userZoomed = false;
  const TAN_V = Math.tan(20 * Math.PI / 180);
  const fitDistance = () => CAM.fitRadius / Math.min(TAN_V, TAN_V * camera.aspect);

  // pixel-art lighting with enough sun to give terrain relief and color depth
  scene.add(new THREE.AmbientLight(0x9aa6c2, 0.5));
  const sun = new THREE.DirectionalLight(0xffe9c8, 0.9); sun.position.set(4, 2.5, 5); scene.add(sun);
  const rim = new THREE.DirectionalLight(0x6f8cff, 0.18); rim.position.set(-5, -1.5, -4); scene.add(rim);

  const world = new THREE.Group(); scene.add(world);

  // ---- terrain height field (gentle: keeps sphere silhouette) ----
  const R = 2;
  let seed = 11;
  const rand = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const latLonDir = (lat, lon) => {
    const phi = (90 - lat) * Math.PI/180, theta = (lon + 180) * Math.PI/180;
    return new THREE.Vector3(-Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta));
  };
  // ---- crater terrain: features carve INTO the sphere, silhouette stays round ----
  // audited stats (8000-sample): water 9%, floors 17%, slopes 14%, plains 52%, rims 8%; radius 0.94R..1.01R
  const siteDir = (s) => latLonDir(s.lat + 12, s.lon); // where the building stands
  const craters = [];
  const VILLAGE_W = 0.12;
  for (const s of SITES) craters.push({ dir: latLonDir(s.lat, s.lon), w: VILLAGE_W, depth: 0.95 }); // one village crater per place

  while (craters.length < SITES.length + 6 && cGuard++ < 600) {                                      // wild craters, kept out of the villages

  const landmarks = [];
  SITES.forEach((s, i) => {

  shoot.visible = false;

  // ---- trail network: the story loop, drawn as stone paths ----

    const pathMat = new THREE.MeshStandardMaterial({ color:0x7b8577, flatShading:true, roughness:1, side:THREE.DoubleSide });
    const HALF_W = 0.018, LIFT = 0.010;
    pathEdges.forEach((edge, phase) => {
      const a = lmDirs[edge[0]], b = lmDirs[edge[1]];
      const theta = Math.acos(Math.max(-1, Math.min(1, a.dot(b))));
      const samples = Math.max(24, Math.round(theta * 60));

        verts.push(pL.x, pL.y, pL.z, pR.x, pR.y, pR.z);

      rg.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
      rg.setIndex(idx);
      rg.computeVertexNormals();

  } catch (e) { console.error('paths failed, continuing without them:', e); }

  world.quaternion.setFromUnitVectors(lmDirs[0], aimDir); // open on the first stop

    if (SITES.some(s => dir.dot(latLonDir(s.lat, s.lon)) > Math.cos(Math.acos(1 - VILLAGE_W) + 0.06))) continue; // stay out of the village craters entirely
    if (onTrail(dir)) continue;
    const g = new THREE.Group();
    const mound = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.07, 7), new THREE.MeshStandardMaterial({ color:0x7f8583, flatShading:true, roughness:1 }));
    mound.position.y = 0.035;

  // atmosphere + stars

  for (let i = 0; i < 40; i++) { const d = 18+Math.random()*20, t = Math.random()*Math.PI*2, ph = Math.acos(Math.random()*2-1); cp.push(d*Math.sin(ph)*Math.cos(t), d*Math.sin(ph)*Math.sin(t), d*Math.cos(ph)); }
  cyanGeo.setAttribute('position', new THREE.Float32BufferAttribute(cp, 3));

  const nebGeo = new THREE.BufferGeometry(); const np = [];
  for (let i = 0; i < 500; i++) { const a = Math.random()*Math.PI*2; const rr = 26 + Math.random()*14; const x = Math.cos(a)*rr, z = Math.sin(a)*rr; np.push(x, (Math.random()-0.5)*6 + x*0.35, z); }
  nebGeo.setAttribute('position', new THREE.Float32BufferAttribute(np, 3));

  // ---------------- interaction ----------------
  // trackball orientation: drags rotate around the SCREEN's axes, no gimbal, no pole walls

  let downX = 0, downY = 0;

  const legendButtons = () => document.querySelectorAll('#legend button');

  };
  let current = null;

    camDir = camDirSel.clone();  // bird's eye swoops down to front facing

      if (en.links && en.links.length) {

    document.body.classList.add('panel-open');

    if (Math.hypot(e.clientX - downX, e.clientY - downY) > 6) return; // the end of a drag is not a click

    if (g) openSite(g.userData.site);
  });
  const closePanel = () => {
    const wasFocused = panel.contains(document.activeElement);
    panel.classList.remove('show');
    document.body.classList.remove('panel-open');
    legendButtons().forEach(b => b.classList.remove('active'));
    selRing.visible = false;
    mode = 'tour';
    camDir = camDirTour.clone();
    aimDir = tourAim();
    if (!userZoomed) camDist = baseDist;
    tourWaitUntil = nowT + 2;
    if (current) { walkLeg = SITES.indexOf(current); walkU = 0; } // pick the story up from the place you just read
    announcedLeg = -1; // re-announce the current leg so caption + legend highlight return
    if (wasFocused && current) { const b = document.querySelector('#legend button[data-id="' + current.id + '"]'); if (b) b.focus({ preventScroll: true }); }

  addEventListener('keydown', e => { if (e.key === 'Escape' && panel.classList.contains('show')) closePanel(); });

  const legend = document.getElementById('legend');
  for (const s of SITES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.label;
    b.dataset.id = s.id;
    b.setAttribute('aria-label', 'Show ' + s.name);
    b.addEventListener('click', () => openSite(s, { focus: true }));
    legend.appendChild(b);
  }

  // traceroute: probe k walks out k hops, the k-th pole answers, the reply walks home
  const HOP_T = 0.34, HOP_PAUSE = 0.35;
  const animatePacket = (n, t) => {
    const P = n.userData.packet;
    if (!P.sched) { P.sched = []; let acc = 0; for (let k = 1; k < P.pts.length; k++) { P.sched.push({ k, start: acc }); acc += 2 * k * HOP_T + HOP_PAUSE; } P.total = acc; }
    const tc = t % P.total;
    let cur = P.sched[0];
    for (const e of P.sched) if (tc >= e.start) cur = e;
    const k = cur.k, local = tc - cur.start, out = k * HOP_T;
    const pos = local < out ? local / HOP_T : Math.max(0, k - (local - out) / HOP_T);
    const i = Math.min(Math.floor(pos), P.pts.length - 2);
    n.position.lerpVectors(P.pts[i], P.pts[i + 1], Math.min(1, pos - i));
    n.visible = local < 2 * out;
    n.material.color.setHex(local < out ? 0x9fe2ff : 0xff7a6b); // probe out, ICMP reply back
    P.lights.forEach((L, j) => L.material.color.setHex(j + 1 === k && local > out - 0.05 && local < out + 0.7 ? 0xffe08a : (j + 1 < k ? 0xa0524a : 0x6b3b35)));
  };
  const lookAt = new THREE.Vector3(), lookGoal = new THREE.Vector3();
  const hudEl = document.getElementById('hud'), bottomUI = document.getElementById('bottomui');

  // ---------------- loop ----------------
  const clock = new THREE.Clock();
  const resize = () => {
    const px = Math.max(1, Math.min(PIXEL, innerWidth / 240));
    renderer.setSize(Math.floor(innerWidth/px), Math.floor(innerHeight/px), false);
    camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
    MAX_D = Math.max(12, fitDistance() * 1.3);
    baseDist = Math.min(MAX_D, Math.max(7.6, fitDistance())); // the whole planet fits between the header and the place buttons
    if (!userZoomed) camDist = baseDist * (mode === 'selected' ? selZoom() : 1);
    if (mode === 'selected') aimDir = camDirSel.clone().applyAxisAngle(X_AXIS, selTilt());
  };
  addEventListener('resize', resize); resize();
  camera.position.copy(camDir).multiplyScalar(camDist); // start at the fitted distance, no zoom-out on load
  (function tick(){
    requestAnimationFrame(tick);
    const t = clock.getElapsedTime();
    const dt = Math.min(t - prevT, 0.1); prevT = t; nowT = t;
    const ease = (rate) => 1 - Math.pow(1 - rate, dt * 60); // same feel at 30, 60, or 144 fps
    if (mode === 'tour' && flyDir === null && !dragging && t > tourWaitUntil) {
      // walk the trail: follow the drawn path centerline between this leg's landmarks
      if (announcedLeg !== walkLeg) {
        announcedLeg = walkLeg;
        const dest = SITES[route[walkLeg + 1]];
        caption.textContent = '';
        legendButtons().forEach(b => b.classList.toggle('touring', b.dataset.id === dest.id));
        revealLegend(dest.id);
      }
      walkU += dt / 7.0; // ~7 seconds per leg: a slow stroll
      const e = pathEdges[walkLeg];
      const u = Math.min(walkU, 1);
      if (walkU < 1) {
        const f = pathPointDir(lmDirs[e[0]], lmDirs[e[1]], walkLeg, u);
        aimAt(f, ease(0.12));
      } else {
        // arrived at the leg's end: keep aiming until the landmark is truly centered, THEN linger
        const endDir = lmDirs[route[walkLeg + 1]];
        aimAt(endDir, ease(0.12));
        const cur = endDir.clone().applyQuaternion(world.quaternion).normalize();
        if (cur.angleTo(aimDir) < 0.05) { walkU = 0; walkLeg = (walkLeg + 1) % (route.length - 1); tourWaitUntil = t + 2.5; }
      }
    }
    if (flyDir !== null) {
      aimAt(flyDir, ease(0.07));
      const cur = flyDir.clone().applyQuaternion(world.quaternion).normalize();
      if (cur.angleTo(aimDir) < 0.02) flyDir = null;
    }
    if (!dragging && (Math.abs(angVel.x) > 1e-5 || Math.abs(angVel.y) > 1e-5)) {
      screenSpin(angVel.y * dt * 60, angVel.x * dt * 60); // inertia in screen space
      const decay = Math.pow(0.94, dt * 60);
      angVel.x *= decay; angVel.y *= decay;
    }
    const shootP = (t * 0.09) % 1;
    if (shootP < 0.06) { const q = shootP / 0.06; shoot.visible = true; shoot.position.set(-14 + q * 24, 9 - q * 5, -12); shoot.rotation.z = -0.2; shoot.material.opacity = 0.9 * (1 - q); }
    else shoot.visible = false;
    camera.position.lerp(camDir.clone().multiplyScalar(camDist), ease(0.06));
    // framing: center the planet in the free space between the header and the place buttons
    const pxToWorld = camDist * TAN_V / (innerHeight / 2);
    const panelOpen = panel.classList.contains('show');
    const top = hudEl.getBoundingClientRect().bottom;
    const bottom = panelOpen && isPhone() ? panel.getBoundingClientRect().top : bottomUI.getBoundingClientRect().top;
    lookGoal.set(0, ((top + bottom) / 2 - innerHeight / 2) * pxToWorld, 0);
    if (panelOpen && isPhone()) lookGoal.y += aimDir.y * R * 0.85;  // phones: the picked place sits in the strip above the sheet
    if (panelOpen && !isPhone()) {                                  // desktop: nudge left only when the panel would crowd the place
      const panelLeft = panel.getBoundingClientRect().left;
      const shift = Math.max(0, innerWidth / 2 - (panelLeft - CAM.panelGap));
      lookGoal.x = shift * pxToWorld;
    }
    lookAt.lerp(lookGoal, ease(0.08));
    camera.lookAt(lookAt);
    if (hoverDirty) { // raycast at most once per frame
      hoverDirty = false;
      const hg = pick(hoverX, hoverY);
      canvas.style.cursor = hg ? 'pointer' : 'grab';
      if (hg) { tip.textContent = hg.userData.site.name; tip.style.left=(hoverX+14)+'px'; tip.style.top=(hoverY-8)+'px'; tip.classList.add('on'); }
      else tip.classList.remove('on');
    }
    if (selRing.visible) selRing.scale.setScalar(1 + Math.sin(t * 3) * 0.06);
    for (const g of landmarks) {
      g.traverse(n => {
        if (n.userData.flame) n.scale.y = 1 + Math.sin(t*9)*0.15;
        if (n.userData.wheel) n.rotation.z = t * 0.8;
        if (n.userData.ember) n.material.opacity = 0.35 + (Math.sin(t*9)+1)*0.15;
        if (n.userData.smoke) { const s = n.userData.smoke; const p = (t * 0.22 + s.phase) % 1; n.position.y = (s.y0 || 0.10) + p * 0.17; const sc = 0.7 + p * 1.1; n.scale.setScalar(sc); n.material.opacity = 0.65 * (1 - p); }
        if (n.userData.proto) { const o = n.userData.proto; const a = t * o.speed + o.phase; n.position.set(o.cx + Math.cos(a) * o.r, o.h + Math.sin(t * 2 + o.phase) * 0.008, o.cz + Math.sin(a) * o.r); n.rotation.y = a; n.rotation.x = a * 0.7; }
        if (n.userData.flag) n.rotation.y = Math.sin(t * 3) * 0.28;
        if (n.userData.fly) { const f = n.userData.fly; const a = t * f.speed + f.phase; n.position.set(f.cx + Math.cos(a) * f.r, f.h + Math.sin(t * 1.7 + f.phase) * 0.02, f.cz + Math.sin(a * 0.8) * f.r); n.material.opacity = 0.3 + (Math.sin(t * 4 + f.phase) + 1) * 0.3; }
        if (n.userData.beam) n.rotation.y = t * 0.9;
        if (n.userData.dome) n.rotation.y = Math.sin(t * 0.12) * 1.2;
        if (n.userData.spin) n.rotation.y = t * n.userData.spin;
        if (n.userData.blink) n.visible = (t % 1.4) < 0.7;
        if (n.userData.screen) n.material.color.setHSL((t * 0.08) % 1, 0.65, 0.62 + Math.sin(t * 11) * 0.04);
        if (n.userData.bob) { n.position.y = n.userData.bob.y0 + Math.sin(t * 2) * 0.0025; n.rotation.z = Math.sin(t * 1.6) * 0.12; n.rotation.y = t * 0.25; }
        if (n.userData.hop) n.position.y = Math.abs(Math.sin(t * 3.2)) * 0.032;
        if (n.userData.fish) { const f = n.userData.fish; n.position.x = f.cx + Math.sin(t * 0.8) * f.r; n.position.y = f.cy + Math.sin(t * 1.9) * 0.003; n.rotation.y = Math.cos(t * 0.8) >= 0 ? 0 : Math.PI; }
        if (n.userData.feed) { const f = n.userData.feed; const p = (t * f.speed + f.phase) % 1; n.position.lerpVectors(f.from, f.to, p); n.position.y += Math.sin(p * Math.PI) * 0.06; n.rotation.y = t * 1.5 + f.phase * 6; n.material.opacity = Math.min(1, p * 6) * (1 - p * p); }
        if (n.userData.packet) animatePacket(n, t);
        if (n.userData.page) { const pg = n.userData.page; const a = t * pg.speed + pg.phase; n.position.set(Math.cos(a) * pg.r, pg.h + Math.sin(t * 1.3 + pg.phase) * 0.012, Math.sin(a) * pg.r); n.rotation.y = -a; n.rotation.z = Math.sin(t + pg.phase) * 0.2; }
      });
    }
    for (const gy of geysers) {
      const cycle = (Math.sin(t * 0.9 + gy.phase) + 1) / 2;          // 0..1 slow cycle
      const burst = Math.max(0, cycle - 0.55) / 0.45;                 // erupts on the high part
      gy.jet.scale.y = 0.1 + burst * 0.95;
      gy.jet.position.y = 0.04 + (0.34 * gy.jet.scale.y) / 2;
      gy.jet.material.opacity = 0.25 + burst * 0.6;
      gy.spray.visible = burst > 0.55;
      gy.spray.position.y = 0.1 + burst * 0.38;
      gy.spray.scale.setScalar(0.6 + burst * 0.8 + Math.sin(t*13)*0.08);
    }
    renderer.render(scene, camera);
  })();
})();
</script>
</body>
</html>
